name: Build Windows

# Windows port of the server: every run compiles all eight daemons from source
# (`./tools/ci-build-win.sh`, no prebuilt objects) and stages native .exe files.
#
# Two toolchain jobs:
#   native - MSYS2 mingw64 gcc on windows-latest (the real product; links the
#            real pcre/openssl import libraries).
#   zig    - zig cross-compile (x86_64-windows-gnu) on ubuntu-latest.  Uses the
#            win32/zigonly stubs for pcre/openssl, so it exercises every
#            compile and link cheaply and catches Linux-isms.
#
# Runs automatically on pushes to the Windows branch and on pull requests
# against main; a GitHub Release is only published for manual ("Run workflow")
# runs of the native job.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      name_suffix:
        description: "Optional suffix added to the release name (e.g. 'rc1')"
        required: false
        default: ""
      strip_binaries:
        description: "Strip debug info from the binaries before packaging"
        type: boolean
        required: false
        default: false
  push:
    branches: [Windows]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: windows x86_64 (MSYS2 mingw64)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The only LFS objects in this repo are stale prebuilt binaries that the
          # build regenerates from source, so do not pay for downloading them.
          lfs: false
          fetch-depth: 1

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            make
            zip
            unzip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pcre

      - name: Show toolchain
        run: |
          uname -a
          gcc --version | head -n1
          g++ --version | head -n1
          make --version | head -n1
          pacman -Q mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl mingw-w64-x86_64-pcre

      - name: Build the server
        env:
          STRICT: "1"
        run: ./tools/ci-build-win.sh

      - name: Verify PE binaries
        run: |
          set -euo pipefail
          file dist-win/bin/*.exe
          file dist-win/bin/*.exe | grep -q 'PE32' || { echo 'binaries are not PE executables'; exit 1; }

      - name: Strip binaries
        if: ${{ inputs.strip_binaries }}
        run: strip dist-win/bin/*.exe

      # Assembles the "unpack and double-click" archive: the 8 .exe files in
      # the per-daemon runtime layout (tools/setup-runtime.sh), the patched
      # configs, the mingw runtime DLLs the binaries import, START-ALL.BAT /
      # START-GS.BAT / STOP-ALL.BAT / STATUS.BAT and the plain-text guides.
      - name: Package one-click runtime zip
        run: |
          set -euo pipefail
          mkdir -p release
          ZIP="release/idealworld-152-server-windows-oneclick.zip"
          ./tools/package-win.sh dist-win "$ZIP"
          # publish the short guide next to the archive as its own asset, so
          # it can be read without unpacking anything
          sed -e 's/\r$//' -e 's/$/\r/' tools/winpkg/HOWTO-PLAY.txt > release/HOWTO-PLAY.TXT
          echo
          unzip -l "$ZIP" | awk 'NR<=4 || /\.dll$|\.BAT$|\.TXT$/'
          dlls="$(unzip -l "$ZIP" | grep -c '\.dll$' || true)"
          if [ "${dlls:-0}" -eq 0 ]; then
            echo 'no runtime DLLs were packaged - the .exe files would not start'
            exit 1
          fi
          unzip -l "$ZIP" | grep -q 'libwinpthread-1.dll' \
            || echo '::warning::libwinpthread-1.dll was not packaged'
          for f in START-ALL.BAT HOWTO-PLAY.TXT README-FIRST.TXT; do
            unzip -l "$ZIP" | grep -q "$f" || { echo "$f is missing from the archive"; exit 1; }
          done

      - name: Package
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA:0:10}"
          PKG="idealworld-152-server-windows-x86_64"
          mkdir -p release
          (cd dist-win && sha256sum bin/* lib/* MANIFEST.txt > SHA256SUMS.txt)
          mv dist-win "$PKG"
          tar -czf "release/$PKG.tar.gz" "$PKG"
          # the executables are also published one by one so they can be grabbed
          # without unpacking the archive
          cp "$PKG"/bin/* release/
          cp "$PKG"/MANIFEST.txt "$PKG"/SHA256SUMS.txt release/
          cp RUNBOOK.md release/
          {
            echo "## idealworld-152 server (Windows) - build ${{ github.run_number }}"
            echo
            echo "Built from \`${GITHUB_SHA}\` on \`${RUNNER_NAME}\` by"
            echo "[${{ github.workflow }} run ${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            echo "Everything in this release was compiled from the sources in this"
            echo "repository with \`./tools/ci-build-win.sh\` (MSYS2 mingw64, no prebuilt objects)."
            echo
            echo "### Contents"
            echo
            echo "| archive | size |"
            echo "| --- | --- |"
            for f in release/*.tar.gz release/*.zip; do
              echo "| \`$(basename \"$f\")\` | $(du -h \"$f\" | cut -f1) |"
            done
            echo
            echo "**\`…-windows-oneclick.zip\`** is the unpack-and-run archive: the 8"
            echo "daemons in their runtime layout with patched configs, the mingw"
            echo "runtime DLLs, \`START-ALL.BAT\` / \`START-GS.BAT\` / \`STOP-ALL.BAT\` /"
            echo "\`STATUS.BAT\`, \`HOWTO-PLAY.TXT\` and \`README-FIRST.TXT\`."
            echo
            echo "It still needs the PW 1.5.2 game data package (into \`gs\\data\\\`)"
            echo "and a matching game client - neither is part of this repository."
            echo "\`HOWTO-PLAY.TXT\` is attached to this release separately; it says"
            echo "what to add and where, what to run, and how to get in game."
            echo
            echo '```'
            cat "$PKG"/MANIFEST.txt
            echo '```'
          } > release/RELEASE_NOTES.md
          echo "### release assets" >> "$GITHUB_STEP_SUMMARY"
          ls -lh release | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-win-native-${{ github.run_number }}
          path: release/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-win-native-${{ github.run_number }}
          path: ci-build-win/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report failures to PR
        if: failure() && github.event.pull_request.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The runner wraps scripts with -e; a failing grep must not kill this.
          set +e
          set -uo pipefail
          {
            echo "## Windows build failure digest (native job, run ${{ github.run_number }})"
            echo ""
            echo "| step | result |"
            echo "| ---- | ------ |"
            for f in ci-build-win/*.status; do
              printf '| %s | %s |\n' "$(basename "$f" .status)" "$(cat "$f" 2>/dev/null || echo MISSING)"
            done
            echo ""
            echo "<details><summary>first error lines per log</summary>"
            echo ""
            for log in ci-build-win/*.log; do
              echo "### $log"
              echo '```'
              grep -E "error:|Error [0-9]+|undefined reference|multiple definition|first defined here|duplicate symbol|undefined symbol|could not open|cannot find|No such file|fatal error|FAILED" "$log" 2>/dev/null | sed -e 's|D:/a/_temp/msys64/mingw64/bin/../lib/gcc/x86_64-w64-mingw32/16.1.0/../../../../||g' -e 's|D:/a/idealworld-152-server/idealworld-152-server/||g' | sort -u | head -n 15
              grep -E "error:|Error [0-9]+|undefined reference|multiple definition|first defined here|duplicate symbol|undefined symbol|could not open|cannot find|No such file|fatal error|FAILED" "$log" 2>/dev/null | sed -e 's|D:/a/_temp/msys64/mingw64/bin/../lib/gcc/x86_64-w64-mingw32/16.1.0/../../../../||g' -e 's|D:/a/idealworld-152-server/idealworld-152-server/||g' | tail -n 20
              grep -E "note: in instantiation|required from here|In file included from|previous declaration|previous definition|candidates are|no known conversion|ambiguous|invalid operands|no matching function|loses information|differing user-defined" "$log" 2>/dev/null | sed -e 's|D:/a/_temp/msys64/mingw64/bin/../lib/gcc/x86_64-w64-mingw32/16.1.0/../../../../||g' -e 's|D:/a/idealworld-152-server/idealworld-152-server/||g' | sort -u | head -n 12
              echo '```'
              echo ""
            done
            echo "</details>"
          } > digest-full.md
          head -c 60000 digest-full.md > digest.md
          echo "digest bytes: $(wc -c < digest-full.md)"
          okc=0; failc=0
          for f in ci-build-win/*.status; do
            [ -e "$f" ] || continue
            line="$(cat "$f" | head -c 120)"
            step="$(basename "$f" .status)"
            if printf '%s' "$line" | grep -q '^ok'; then okc=$((okc+1)); continue; fi
            failc=$((failc+1))
            log="ci-build-win/$step.log"
            tu=""
            ccerr=""
            if [ -f "$log" ]; then
              tu="$(tail -n 25 "$log" | grep -m1 -oE '[A-Za-z0-9_./-]+\.o\]? Error [0-9]+' | head -c 80)"
              ccerr="$(grep -m1 -E 'error:|undefined|cannot |fatal|No such file' "$log" | head -c 550)"
            else
              tu="(no log)"
            fi
            echo "::error::$step [$line] $tu :: ${ccerr:-no error line found}"
          done
          echo "::notice::steps ok=$okc failed=$failc"
          export PATH="/c/Program Files/Git/bin:/c/Program Files/Git/cmd:$PATH"
          GH_BIN="$(command -v gh || command -v gh.exe || true)"
          for cand in "/c/Program Files/GitHub CLI/gh.exe" "C:/Program Files/GitHub CLI/gh.exe"; do
            if [ -z "$GH_BIN" ] && [ -x "$cand" ]; then GH_BIN="$cand"; fi
          done
          if [ -n "$GH_BIN" ]; then
            ERR="$("$GH_BIN" pr comment "${{ github.event.pull_request.number }}" --repo ${{ github.repository }} --body-file digest.md 2>&1)"
            if [ $? -eq 0 ]; then
              echo "::notice::posted digest to PR as comment"
            else
              echo "::warning::gh pr comment failed: ${ERR:0:800}"
            fi
          else
            echo "::warning::gh CLI not found; digest only available as annotations/artifacts"
          fi
          exit 0

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-build-${{ github.run_number }}
          name: >-
            Windows binaries - build ${{ github.run_number }}${{
              inputs.name_suffix && format(' {0}', inputs.name_suffix) || '' }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/*.tar.gz
            release/*.zip
            release/*.txt
            release/RUNBOOK.md
            release/glinkd.exe
            release/gdeliveryd.exe
            release/gauthd.exe
            release/gfactiond.exe
            release/gamedbd.exe
            release/uniquenamed.exe
            release/logservice.exe
            release/gs.exe
          prerelease: true
          fail_on_unmatched_files: true

  zig:
    name: windows x86_64 (zig cross)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Set up zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Show toolchain
        run: |
          uname -a
          zig version
          make --version | head -n1

      - name: Build the server
        env:
          STRICT: "1"
          ZIG: zig
        run: ./tools/ci-build-win.sh

      - name: Verify PE binaries
        run: |
          set -euo pipefail
          file dist-win/bin/*.exe
          file dist-win/bin/*.exe | grep -q 'PE32' || { echo 'binaries are not PE executables'; exit 1; }

      - name: Upload dist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-win-zig-${{ github.run_number }}
          path: dist-win/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-win-zig-${{ github.run_number }}
          path: ci-build-win/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report failures to PR
        if: failure() && github.event.pull_request.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The runner wraps scripts with -e; a failing grep must not kill this.
          set +e
          set -uo pipefail
          {
            echo "## Windows build failure digest (zig job, run ${{ github.run_number }})"
            echo ""
            echo "| step | result |"
            echo "| ---- | ------ |"
            for f in ci-build-win/*.status; do
              printf '| %s | %s |\n' "$(basename "$f" .status)" "$(cat "$f" 2>/dev/null || echo MISSING)"
            done
            echo ""
            echo "<details><summary>first error lines per log</summary>"
            echo ""
            for log in ci-build-win/*.log; do
              echo "### $log"
              echo '```'
              grep -E "error:|Error [0-9]+|undefined reference|multiple definition|first defined here|duplicate symbol|undefined symbol|could not open|cannot find|No such file|fatal error|FAILED" "$log" 2>/dev/null | sed -e 's|/home/runner/work/idealworld-152-server/idealworld-152-server/||g' -e 's|/home/runner/work/_temp/[^ /]*/zig-linux-[^ /]*/|zig:/|g' | sort -u | head -n 15
              grep -E "error:|Error [0-9]+|undefined reference|multiple definition|first defined here|duplicate symbol|undefined symbol|could not open|cannot find|No such file|fatal error|FAILED" "$log" 2>/dev/null | sed -e 's|/home/runner/work/idealworld-152-server/idealworld-152-server/||g' -e 's|/home/runner/work/_temp/[^ /]*/zig-linux-[^ /]*/|zig:/|g' | tail -n 20
              grep -E "note: in instantiation|required from here|In file included from|previous declaration|previous definition|candidates are|no known conversion|ambiguous|invalid operands|no matching function|loses information|differing user-defined" "$log" 2>/dev/null | sed -e 's|/home/runner/work/idealworld-152-server/idealworld-152-server/||g' -e 's|/home/runner/work/_temp/[^ /]*/zig-linux-[^ /]*/|zig:/|g' | sort -u | head -n 12
              echo '```'
              echo ""
            done
            echo "</details>"
          } > digest-full.md
          head -c 60000 digest-full.md > digest.md
          echo "digest bytes: $(wc -c < digest-full.md)"
          okc=0; failc=0
          for f in ci-build-win/*.status; do
            [ -e "$f" ] || continue
            line="$(cat "$f" | head -c 120)"
            step="$(basename "$f" .status)"
            if printf '%s' "$line" | grep -q '^ok'; then okc=$((okc+1)); continue; fi
            failc=$((failc+1))
            log="ci-build-win/$step.log"
            tu=""
            ccerr=""
            if [ -f "$log" ]; then
              tu="$(tail -n 25 "$log" | grep -m1 -oE '[A-Za-z0-9_./-]+\.o\]? Error [0-9]+' | head -c 80)"
              ccerr="$(grep -m1 -E 'error:|undefined|cannot |fatal|No such file' "$log" | head -c 550)"
            else
              tu="(no log)"
            fi
            echo "::error::$step [$line] $tu :: ${ccerr:-no error line found}"
          done
          echo "::notice::steps ok=$okc failed=$failc"
          export PATH="/c/Program Files/Git/bin:/c/Program Files/Git/cmd:$PATH"
          GH_BIN="$(command -v gh || command -v gh.exe || true)"
          for cand in "/c/Program Files/GitHub CLI/gh.exe" "C:/Program Files/GitHub CLI/gh.exe"; do
            if [ -z "$GH_BIN" ] && [ -x "$cand" ]; then GH_BIN="$cand"; fi
          done
          if [ -n "$GH_BIN" ]; then
            ERR="$("$GH_BIN" pr comment "${{ github.event.pull_request.number }}" --repo ${{ github.repository }} --body-file digest.md 2>&1)"
            if [ $? -eq 0 ]; then
              echo "::notice::posted digest to PR as comment"
            else
              echo "::warning::gh pr comment failed: ${ERR:0:800}"
            fi
          else
            echo "::warning::gh CLI not found; digest only available as annotations/artifacts"
          fi
          exit 0
