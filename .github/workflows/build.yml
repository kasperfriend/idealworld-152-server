name: Build Server

# Manual only: run it from Actions -> "Build Server" -> "Run workflow".
# Every run compiles the whole server from source on a clean GitHub runner and
# publishes the results as assets of a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      name_suffix:
        description: "Optional suffix added to the release name (e.g. 'rc1')"
        required: false
        default: ""
      strip_binaries:
        description: "Strip debug info from the binaries before packaging"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: build-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: linux x86_64 build + release
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The only LFS objects in this repo are stale prebuilt binaries that the
          # build regenerates from source, so do not pay for downloading them.
          lfs: false
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libssl-dev \
            libpcre3-dev

      - name: Show toolchain
        run: |
          uname -a
          gcc --version | head -n1
          g++ --version | head -n1
          make --version | head -n1
          dpkg -l 'libssl-dev' 'libpcre3-dev' | tail -n2

      - name: Build the server
        env:
          STRICT: "1"
        run: ./tools/ci-build.sh

      - name: Strip binaries
        if: ${{ inputs.strip_binaries }}
        run: strip dist/bin/*

      - name: Package
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA:0:10}"
          PKG="idealworld-152-server-linux-x86_64"
          mkdir -p release
          mv dist "$PKG"
          tar -czf "release/$PKG.tar.gz" "$PKG"
          # the executables are also published one by one so they can be grabbed
          # without unpacking the archive
          cp "$PKG"/bin/* release/
          cp "$PKG"/MANIFEST.txt "$PKG"/SHA256SUMS.txt release/
          {
            echo "## idealworld-152 server - build ${{ github.run_number }}"
            echo
            echo "Built from \`${GITHUB_SHA}\` on \`${RUNNER_NAME}\` by"
            echo "[${{ github.workflow }} run ${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            echo "Everything in this release was compiled from the sources in this"
            echo "repository with \`./tools/ci-build.sh\` (no prebuilt objects)."
            echo
            echo "### Contents"
            echo
            echo "| archive | size |"
            echo "| --- | --- |"
            for f in release/*.tar.gz; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo '```'
            cat "$PKG"/MANIFEST.txt
            echo '```'
          } > release/RELEASE_NOTES.md
          echo "### release assets" >> "$GITHUB_STEP_SUMMARY"
          ls -lh release | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: .ci-build/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: >-
            Server binaries - build ${{ github.run_number }}${{
              inputs.name_suffix && format(' {0}', inputs.name_suffix) || '' }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/*.tar.gz
            release/*.txt
            release/glinkd
            release/gdeliveryd
            release/gauthd
            release/gfactiond
            release/gamedbd
            release/uniquenamed
            release/logservice
            release/gs
          prerelease: true
          fail_on_unmatched_files: true
